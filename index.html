<!-- MODAL NOUVEL / ÉDITION UTILISATEUR -->
<div id="user-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
            <h3 id="user-modal-title" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-user-gear text-cyan-600"></i> Ajouter un Utilisateur
            </h3>
            <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <form id="user-form" onsubmit="saveUser(event)" class="space-y-4">
            <!-- Champ caché pour stocker l'index lors de l'édition -->
            <input type="hidden" id="user-id-index" value="-1">
            
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nom d'utilisateur</label>
                <input type="text" id="user-username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Mot de passe</label>
                <input type="password" id="user-password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Niveau d'accès (Rôle)</label>
                <select id="user-role" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                    <option value="ADMIN">ADMIN (Accès complet)</option>
                    <option value="Gestionnaire">Gestionnaire (Alignements & Remplaçants)</option>
                </select>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" onclick="closeUserModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg">Annuler</button>
                <button type="submit" class="px-4 py-2 text-sm font-bold text-white bg-cyan-600 hover:bg-cyan-700 rounded-lg shadow">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
